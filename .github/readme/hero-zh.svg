  <g id="title-block">
    <text x="210" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="88" font-weight="700" fill="#1C1C1E" letter-spacing="-2">Utter</text>
    <text x="64" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="26" fill="#3A3A3C">说完一句话，整理好的文字就出现在光标处。</text><text x="64" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="26" fill="#3A3A3C">语音识别和润色都在你的 Mac 上完成。</text>
    <text x="64" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#8A867E">macOS · Apple 芯片 · Qwen3-ASR 0.6B + 自训 Qwen3-0.6B</text>
