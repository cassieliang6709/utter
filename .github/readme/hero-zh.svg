<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Utter：macOS 上的本机语音输入</title>
  <desc id="desc">Utter 把带口头禅和改口的一句话整理成干净的文字，松开按键后约 0.44 秒出字。</desc>
  <rect width="1200" height="420" rx="28" fill="#F2EFE9"/>
