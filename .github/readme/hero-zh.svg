    <text x="672" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" fill="#77736B">嗯那个我今天想就是说把那个 SGLang 的</text><text x="672" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" fill="#77736B">radix cache 呃不对是 radix attention</text><text x="672" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" fill="#77736B">的那个 PR 再看一下</text>
    <path d="M672 230 h432" stroke="#DDD8CE" stroke-width="2"/>
    <circle cx="672" cy="262" r="6" fill="#E5452B"/>
    <text x="690" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#8A867E" letter-spacing="1">Utter 打出来的</text>
    <text x="1104" y="268" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="18" fill="#8A867E"><tspan font-size="22" font-weight="700" fill="#E5452B">0.44 s</tspan> 出字</text>
    <text x="672" y="306" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="24" font-weight="600" fill="#1C1C1E">我今天想再看一下 radix attention 的 PR</text>
