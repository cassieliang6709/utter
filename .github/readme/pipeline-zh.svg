<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">从我的听写记录，到打出来的一句话</title>
  <desc id="desc">六步：我自己的听写数据、微调 Qwen3-0.6B、评测、量化门禁、C++ 引擎、Utter app。</desc>
  <rect width="1200" height="860" rx="28" fill="#F2EFE9"/>
  <circle cx="72" cy="78" r="7" fill="#E5452B"/>
  <text x="94" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="40" font-weight="700" fill="#1C1C1E">从我的听写记录，到打出来的一句话</text>
  <g id="stage-1" transform="translate(64 140)">
    <rect width="520" height="206" rx="18" fill="#FBFAF7" stroke="#DDD8CE" stroke-width="2"/>
    <text x="28" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#E5452B">01</text>
    <text x="72" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="28" font-weight="700" fill="#1C1C1E">数据</text>
    <text x="28" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" fill="#3A3A3C">我自己的 364 条听写</text>
    <text x="28" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" fill="#3A3A3C">识别原文 → 实际留下的文字</text>
    <text x="28" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" fill="#3A3A3C">脱敏；按时间留出最新 40 条</text>
  </g>
  <path d="M588 243.0 h24" stroke="#8A867E" stroke-width="2"/><path d="M606 237.0 l7 6 l-7 6" fill="none" stroke="#8A867E" stroke-width="2"/>
  <g id="stage-2" transform="translate(616 140)">
    <rect width="520" height="206" rx="18" fill="#FBFAF7" stroke="#DDD8CE" stroke-width="2"/>
    <text x="28" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#E5452B">02</text>
    <text x="72" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="28" font-weight="700" fill="#1C1C1E">微调</text>
    <text x="28" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" fill="#3A3A3C">Qwen3-0.6B 全参 bf16，一张 RTX 4090</text>
    <text x="28" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" fill="#3A3A3C">补 50 条合成锚点，含 26 条改口</text>
    <text x="28" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" fill="#3A3A3C">按术语保留率早停</text>
  </g>
  <path d="M876.0 350 V360 H324.0 V372" fill="none" stroke="#C9C4BA" stroke-width="2"/><path d="M318.0 365 l6 7 l6 -7" fill="none" stroke="#C9C4BA" stroke-width="2"/>
  <g id="stage-3" transform="translate(64 376)">
    <rect width="520" height="206" rx="18" fill="#FBFAF7" stroke="#DDD8CE" stroke-width="2"/>
    <text x="28" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#E5452B">03</text>
    <text x="72" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="28" font-weight="700" fill="#1C1C1E">评测</text>
    <text x="28" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" fill="#3A3A3C">相似度 0.073 → 0.836</text>
    <text x="28" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" fill="#3A3A3C">术语保留 100%（59/59）</text>
    <text x="28" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" fill="#3A3A3C">没见过的改口 1/10 → 7/10</text>
  </g>
  <path d="M588 479.0 h24" stroke="#8A867E" stroke-width="2"/><path d="M606 473.0 l7 6 l-7 6" fill="none" stroke="#8A867E" stroke-width="2"/>
  <g id="stage-4" transform="translate(616 376)">
    <rect width="520" height="206" rx="18" fill="#FBFAF7" stroke="#DDD8CE" stroke-width="2"/>
    <text x="28" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#E5452B">04</text>
    <text x="72" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="28" font-weight="700" fill="#1C1C1E">量化</text>
    <text x="28" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" fill="#3A3A3C">Q8_0 对 bf16 相似度 0.998，通过</text>
    <text x="28" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" fill="#3A3A3C">Q4_0 0.948，没过 0.95 门槛</text>
    <text x="28" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" fill="#3A3A3C">一个 610 MB 文件</text>
  </g>
  <path d="M876.0 586 V596 H324.0 V608" fill="none" stroke="#C9C4BA" stroke-width="2"/><path d="M318.0 601 l6 7 l6 -7" fill="none" stroke="#C9C4BA" stroke-width="2"/>
  <g id="stage-5" transform="translate(64 612)">
    <rect width="520" height="206" rx="18" fill="#FBFAF7" stroke="#DDD8CE" stroke-width="2"/>
    <text x="28" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#E5452B">05</text>
    <text x="72" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="28" font-weight="700" fill="#1C1C1E">引擎</text>
    <text x="28" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" fill="#3A3A3C">基于 llama.cpp 的 C++ 服务，11 MB</text>
    <text x="28" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" fill="#3A3A3C">系统提示词 KV 常驻，前缀复用</text>
    <text x="28" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" fill="#3A3A3C">投机解码 0.43 → 0.19 s</text>
  </g>
  <path d="M588 715.0 h24" stroke="#8A867E" stroke-width="2"/><path d="M606 709.0 l7 6 l-7 6" fill="none" stroke="#8A867E" stroke-width="2"/>
  <g id="stage-6" transform="translate(616 612)">
    <rect width="520" height="206" rx="18" fill="#2B2D31" stroke="#2B2D31" stroke-width="2"/>
    <text x="28" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="700" fill="#E5452B">06</text>
    <text x="72" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="28" font-weight="700" fill="#F2EFE9">Utter</text>
    <text x="28" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" fill="#D9D5CC">边说边整理，每说完一句就送去</text>
    <text x="28" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" fill="#D9D5CC">只差标点也复用已整理的部分</text>
    <text x="28" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="21" fill="#D9D5CC">松开按键到出字 0.44 s</text>
  </g>
</svg>
